name: LeafLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Code Quality and API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi>=0.115,<1.0" \
            "uvicorn[standard]>=0.30,<1.0" \
            "pydantic-settings>=2.0,<3.0" \
            "python-multipart>=0.0.9" \
            "pillow>=10.0" \
            "torch>=2.5,<3.0" \
            "torchvision>=0.20,<1.0" \
            "numpy>=1.26" \
            "pandas>=2.2" \
            "prometheus-client>=0.20,<1.0" \
            "pytest>=8.0" \
            "httpx>=0.27" \
            "ruff>=0.9"


      - name: Run API integration tests
        run: |
          pytest backend/tests/test_prediction_api.py -v

      - name: Validate DVC pipeline configuration
        run: |
          python -m pip install "dvc>=3.0,<4.0"
          dvc dag
