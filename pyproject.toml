[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leaflens"
version = "0.1.0"
description = "AIOps-driven plant leaf disease detection system"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "torch>=2.5,<3.0",
    "torchvision>=0.20,<1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "mlflow==3.18.0",
    "ray[data]==2.60.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tests*"]
