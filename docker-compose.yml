services:
  backend:
    image: leaflens-backend:latest
    container_name: leaflens-backend-compose
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: leaflens-frontend:latest
    container_name: leaflens-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
